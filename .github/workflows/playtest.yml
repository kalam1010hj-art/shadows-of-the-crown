name: Village playtest
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
        env:
          PLAYTEST_BROWSER: /usr/bin/google-chrome
